[package]
name = "mewradio"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = { version = "0.33", default-features = false, features = ["glow", "default_fonts"] }
rodio = { version = "0.23", default-features = false, features = ["playback", "vorbis"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

[target."cfg(windows)".dependencies]
raw-window-handle = "0.6.2"
souvlaki = { version = "0.9.3", default-features = false }
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_System_Com"] }

[build-dependencies]
winresource = "0.1"
